# Public podcast edge. Serves ONLY /podcast (feed + media) from a read-only mount.
# Fronted by the Cloudflare tunnel (aern.dev -> aern-public:80); aernhome is no
# longer internet-exposed. Everything outside /podcast returns 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Force the RSS content type (nginx's default mime.types maps .xml -> text/xml).
    location = /podcast/feed.xml {
        types { }
        default_type application/rss+xml;
    }

    # mp3/jpg/png content types come from nginx's built-in mime.types include.
    location /podcast/ {
        autoindex off;
    }

    location / {
        return 404;
    }
}
