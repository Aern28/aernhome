<!-- Nexus BYOS — free-text screen (2026-09-02): `wall: text: pick up milk` -> {{ msg }} big and centered.
     Resolution: 800x480 (TRMNL OG). -->
<div class="view view--full">
<div style="height:100%; padding:28px 36px; font-family:monospace; display:flex; flex-direction:column;">
  <div style="display:flex; justify-content:space-between; align-items:baseline;">
    <span style="font-size:14px; font-weight:700; letter-spacing:2px;">NEXUS</span>
    <span style="font-size:12px; color:#555;">{{ updated }}</span>
  </div>
  <div style="border-top:2px solid #000; margin:6px 0 0 0;"></div>
  <div style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center;">
    {% assign n = msg | size %}
    <div style="font-weight:700; line-height:1.2; word-break:break-word;{% if n < 24 %} font-size:64px;{% elsif n < 80 %} font-size:44px;{% elsif n < 200 %} font-size:30px;{% else %} font-size:22px;{% endif %}">{{ msg }}</div>
  </div>
</div>
</div>
