version: '3.8'

services:
  aernhome:
    build: .
    container_name: aernhome-dashboard
    restart: unless-stopped
    ports:
      # Bind to the Tailscale IP + localhost only — NOT 0.0.0.0, which published the
      # write/delete APIs to the entire LAN (incl. the IoT segment). n8n and cloudflared
      # reach the app over the shared aernhome network (container DNS), so they're
      # unaffected. Boot-order note: needs the Tailscale interface up before the
      # container starts; Docker Desktop is slow enough to start that this holds in
      # practice (restart:unless-stopped recovers if the bind ever loses the race).
      - "100.110.245.37:5555:5555"   # Tailscale — browser access via http://ashaman:5555
      - "127.0.0.1:5555:5555"        # host-local debugging
    volumes:
      # Live code overlay — /app comes from the repo checkout, not the baked image.
      # Deploys are now `git pull` + `docker restart aernhome-dashboard`; NO rebuild
      # (builds die over SSH). Rebuild is only needed when requirements.txt changes.
      - C:/projects/aernhome:/app
      - C:/projects/aernhome/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - C:/projects/aernhome:/host_c:ro
      - G:/ollama:/host_g:ro
      - claude-workspace:/workspace:ro
      - C:/tcg-inventory:/tcg:ro
      # Obsidian vault, read-only — browsed at /nexus/vault (Ashaman's checkout;
      # Aernbot pushes to it, so this stays current without any sync step)
      - C:/projects/obivault:/vault:ro
    security_opt:
      - no-new-privileges:true
    environment:
      - FLASK_ENV=production
      - DATA_DIR=/data
      - TZ=America/Chicago
      - AERNHOME_UNLOCK_TOKEN=${AERNHOME_UNLOCK_TOKEN}
      # Nexus connectors — headless container can't DPAPI-unlock Bitwarden, so the
      # tokens come from .env (gitignored). Empty = that connector degrades to
      # zeroed/title-only and never errors.
      - TODOIST_TOKEN=${TODOIST_TOKEN:-}
      - TMDB_TOKEN=${TMDB_TOKEN:-}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
      # Oura health glance (Personal Access Token from cloud.ouraring.com); empty = widget hidden.
      - OURA_TOKEN=${OURA_TOKEN:-}
      # Schedule widget reads this calendar via the mounted Claudendar service account.
      # Defaults in-code to mcarroll203@gmail.com; share that calendar with
      # claude-bot@claudendar.iam.gserviceaccount.com (read-only) to populate it.
      - CALENDAR_ID=${CALENDAR_ID:-mcarroll203@gmail.com}
      # Second schedule widget calendar (Gal's). No in-code default — empty
      # means the Gal sub-list stays empty. Must also be shared read-only with
      # claude-bot@claudendar.iam.gserviceaccount.com.
      - CALENDAR_ID_GAL=${CALENDAR_ID_GAL:-}
      - CALENDAR_ID_MATT=${CALENDAR_ID_MATT:-mcarroll203@gmail.com}
      # Notion API token — used by nexus_notion_import.py and sync_family_agenda.py.
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      # TCG business widget reads inventory.db; it's mounted ro at /tcg (see volumes),
      # so point the connector there (default is a Windows path that doesn't exist here).
      - TCG_DB_PATH=/tcg/inventory.db
      # Fleet sentinel → Signal alerting (numbers live in .env; empty = alerts log-and-skip)
      - SIGNAL_HTTP_URL=http://signal-cli:8080
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT:-}
      - SIGNAL_ALERT_TO=${SIGNAL_ALERT_TO:-}
      - FLEET_INTERVAL=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aernhome
      # Joined so the sentinel can POST alerts to signal-cli's JSON-RPC directly
      - relay-net

  # Public podcast edge: a read-only static server. The Cloudflare tunnel points
  # aern.dev here (NOT at aernhome), so the docker.sock-bearing app is off the
  # internet entirely. No host port bind - cloudflared reaches it by name over the
  # shared aernhome network. Serves only /podcast (feed + media); 404s everything else.
  aern-public:
    image: nginx:alpine
    container_name: aern-public
    restart: unless-stopped
    volumes:
      - C:/projects/aernhome/data/podcast:/usr/share/nginx/html/podcast:ro
      - C:/projects/aernhome/aern-public-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - aernhome

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aernhome
    depends_on:
      - aernhome

volumes:
  claude-workspace:
    external: true
    name: discord-claude-relay_claude-workspace

networks:
  aernhome:
    driver: bridge
  relay-net:
    external: true
    name: discord-claude-relay_relay-net
