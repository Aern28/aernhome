<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AernHome{% endblock %}</title>
    <!-- Precompiled Tailwind (was the cdn.tailwindcss.com Play CDN, which recompiled
         CSS in the browser on every load). Rebuild: npm run build:css -->
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_ver }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
