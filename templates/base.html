<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AernHome{% endblock %}</title>
    <!-- Precompiled Tailwind (was the cdn.tailwindcss.com Play CDN, which recompiled
         CSS in the browser on every load). Rebuild: npm run build:css -->
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_ver }}">
    <!-- PWA: installable, cached shell for instant loads (esp. remote over Tailscale) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
</body>
</html>
