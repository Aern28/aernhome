{% extends "nexus_base.html" %}
{% block nexus_title %}Needs Aern{% endblock %}

{% block nexus_content %}
<!-- THE lane: everything waiting on the human, priority-ordered. Phone-first —
     big touch targets, minimal chrome. Fetched client-side from
     /api/needs-aern, re-rendered every 60s. -->

<!-- Live agenda (Aern 10/09, seat project nexus-canon): the daily + weekly
     agenda with each {p:<id>} line showing its project's LIVE board status.
     Read-only; agents tick lines. From /api/agenda/view, refreshed with the lane. -->
<section id="agenda-live" class="mb-8">
    <div id="agenda-daily" class="bg-dark-card border border-dark-border rounded-lg p-4 sm:p-5 mb-3">
        <p class="text-sm text-gray-400">Loading agenda…</p>
    </div>
    <details class="bg-dark-card border border-dark-border rounded-lg p-4 sm:p-5">
        <summary class="text-sm font-semibold text-white cursor-pointer">This week</summary>
        <div id="agenda-weekly" class="mt-3"></div>
    </details>
</section>

<div class="flex items-center justify-between flex-wrap gap-2 mb-4">
    <p class="text-sm text-gray-400">Everything waiting on you. Priority order, top to bottom.</p>
    <p class="text-xs text-gray-400">Checked: <span id="aern-generated-at">—</span></p>
</div>

<div id="aern-list" class="space-y-3">
    <p class="text-sm text-gray-400">Loading…</p>
</div>
{% endblock %}

{% block nexus_scripts %}
<script src="/static/js/nexus_sb.js?v={{ js_ver }}"></script>
{% endblock %}
