{% extends "nexus_base.html" %}
{% block nexus_title %}{{ doc.title }}{% endblock %}

{% block nexus_content %}
<article class="bg-dark-card border border-dark-border rounded-lg p-5" data-doc="{{ doc.id }}">
    <div class="flex items-start justify-between gap-3 mb-4 pb-4 border-b border-dark-border">
        <div class="min-w-0">
            <a href="/nexus/docs" class="text-xs text-gray-400 hover:text-gray-200">← all docs</a>
            <h2 class="text-2xl font-bold text-white break-words mt-1">{{ doc.title }}</h2>
            <div class="text-[11px] text-gray-400 mt-1">
                {% if doc.area %}<span class="uppercase mr-2">{{ doc.area }}</span>{% endif %}
                updated {{ doc.updated_at[:16] }}
            </div>
        </div>
        <div class="flex gap-2 shrink-0 text-sm">
            <button data-nx-action="doc-pin" data-id="{{ doc.id }}" data-pinned="{{ 1 if doc.pinned else 0 }}"
                    title="{{ 'Unpin' if doc.pinned else 'Pin' }}"
                    class="{% if doc.pinned %}text-amber-400{% else %}text-gray-400 hover:text-amber-400{% endif %}">📌</button>
            <button data-nx-action="doc-edit" title="Edit" class="text-gray-400 hover:text-blue-400">✎</button>
            <button data-nx-action="doc-delete" data-id="{{ doc.id }}" title="Delete" class="text-gray-400 hover:text-red-400">✕</button>
        </div>
    </div>

    <!-- Rendered (sanitized server-side) -->
    <div class="nx-prose" data-doc-view>{{ doc.html | safe }}</div>

    <!-- Editor (hidden until ✎) -->
    <div class="hidden mt-2" data-doc-editor>
        <textarea data-doc-md rows="20"
                  class="w-full font-mono bg-dark-bg border border-dark-border rounded-md px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500">{{ doc.body_md }}</textarea>
        <div class="flex items-center gap-3 mt-2">
            <button data-nx-action="doc-save" data-id="{{ doc.id }}"
                    class="px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-sm">Save</button>
            <button data-nx-action="doc-cancel" class="px-3 py-2 rounded-md text-gray-400 hover:text-gray-200 text-sm">Cancel</button>
        </div>
    </div>
</article>
{% endblock %}
